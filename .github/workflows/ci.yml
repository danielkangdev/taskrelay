name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: taskrelay
          POSTGRES_PASSWORD: taskrelay
          POSTGRES_DB: taskrelay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskrelay"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://taskrelay:taskrelay@localhost:5432/taskrelay_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
